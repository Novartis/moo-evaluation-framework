[project]
name = "evaluation-framework"
version = "0.1.0"
description = "A Python framework for evaluating and comparing multi-objective optimization (MOO) algorithms in molecular design and drug discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "numpy<2",
    "pandas>=2.3.2",
    "pygmo>=2.19.5",
    "rdkit==2022.9.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]
